name: CD

on:
  push:
    branches:
    - main

jobs:


  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - uses: Roblox/setup-foreman@v1
      name: Install Foreman
      with:
        version: "^1.0.0"
        token: ${{ SECRETS.GITHUB_TOKEN }}

    - run: rojo build -o game.rblx

    - run: rbxcloud experience publish -f game.rblx -p 10467927922 -u 3812599065 -t published -a ${{ SECRETS.API_KEY }}
