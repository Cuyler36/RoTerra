name: Deploy to Prod

on:
  push:
    tags:
    - 'v*'

jobs:


  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - uses: Roblox/setup-foreman@v1
      name: Install Foreman
      with:
        version: "^1.0.0"
        token: ${{ SECRETS.GITHUB_TOKEN }}

    - run: wally install

    - run: rojo build -o game.rbxl

    - run: rbxcloud experience publish -f game.rbxl -p 10468122561 -u 3812642876 -t published -a ${{ SECRETS.API_KEY }}
